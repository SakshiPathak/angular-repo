<div>
    <form (ngSubmit)="onSubmit()">
        <label for="email_id">Email ID</label>
        <input type="email" id="email_id" name="email_id" placeholder="Enter Email Id" [(ngModel)]="emailId" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter Password" [(ngModel)]="password"
            required>

        <label>
            <input type="checkbox" name="remember_me" id="remember_me" [(ngModel)]="rememberMe">Remember Me
        </label>

        <button type="submit" [disabled]="isLoading">{{ isLoading ? 'Logging in...' : 'Login' }}</button>

        @if (errorMessage) {
        <p style="color: red;">{{ errorMessage }}</p>
        }
    </form>
</div>
